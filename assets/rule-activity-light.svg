<svg xmlns="http://www.w3.org/2000/svg" width="880" height="44" viewBox="0 0 880 44" role="img" aria-label="~/activity">
<style>
  .m { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Monaco,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace; }
  .s { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; }
  .f { animation: in .45s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .f, .cur { animation: none !important; } }
</style>
<text class="m" x="2" y="27" font-size="14" xml:space="preserve"><tspan fill="#b45309" font-weight="700">~ ❯ </tspan><tspan fill="#1b1e25">cd ~/activity</tspan></text>
<line x1="160.0" y1="22.5" x2="661.6" y2="22.5" stroke="#dcd8ce" stroke-dasharray="2 4"/>
<text class="m" x="878" y="27" font-size="12" fill="#5b6372" text-anchor="end">every commit, eaten in order</text>
</svg>
